name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install capstone==5.0.7
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-build-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check build path safety
        shell: pwsh
        run: ./build_windows.ps1 -SelfTest
